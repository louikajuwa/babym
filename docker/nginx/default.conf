server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 40M;

    # Real-time: proxy Socket.IO to the Node service (single origin for the browser)
    location /socket.io/ {
        proxy_pass http://socket:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Uploaded photos (Laravel's public disk, symlinked via storage:link) — served as static files
    location ^~ /storage/ {
        root /var/www/api/public;
        try_files $uri =404;
    }

    # Laravel front controller — everything under /api/ goes through the API app.
    # NOTE: the try_files fallback MUST land in a named location (@api_front), not a bare
    # "/index.php" target — that would re-run top-level location matching against the
    # rewritten "/index.php" URI (no longer starting with /api/) and fall into the static
    # `location /` block below instead of PHP-FPM.
    location ^~ /api/ {
        root /var/www/api/public;
        try_files $uri @api_front;
    }
    location @api_front {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
    }

    # Static frontend (index.html, admin-*.html, assets/)
    location / {
        root /var/www/web;
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
